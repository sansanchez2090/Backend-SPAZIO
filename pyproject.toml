[project]
name = "spazio-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "sansanchez2090",email = "san.sanchezm.2090@gmail.com"}
]
requires-python = ">=3.11,<3.15"  # Permite Python 3.11, 3.12, 3.13 y 3.14
dependencies = [
    "fastapi (>=0.162.0,<0.170.0)",
    "uvicorn[standard] (>=0.54.0,<0.60.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "asyncpg (>=0.32.0,<0.40.0)",
    "geoalchemy2 (>=0.20.0,<0.30.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "python-dateutil (>=3.0.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
package-mode = false
